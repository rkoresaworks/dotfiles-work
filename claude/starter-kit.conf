# Claude Code Starter Kit (cloudnative-co/claude-code-starter-kit) の wizard 選択結果。
# setup.sh 実行前に ~/.claude-starter-kit.conf へコピーすると、対話をスキップして同じ構成を再現できる。
#
# KIT_REPO は意図的に含めていない: 値が絶対パスで、config は変数展開されない
# (_safe_source_config が printf -v で literal 代入する) ため。未設定なら既定の
# チェックアウト先 ~/.claude-starter-kit に fallback し、setup.sh が実際の値で書き戻す。
